[package]
name = "oxidendron"
version = "1.1.0"
edition = "2024"
description = "A Huffman encoding and decoding cli tool"
readme = "README.md"
repository = "https://github.com/LukasHuth/Oxidendron"
license-file = "LICENSE"
keywords = ["huffman", "compression"]
categories = ["command-line-utilities"]

[[bin]]
name = "oxidendron"
path = "src/main.rs"

[dependencies]
byteorder = "1.5.0"
